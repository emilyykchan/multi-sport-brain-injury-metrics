[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-sport-brain-injury-metrics"
version = "0.1.0"
description = "Reproducible calculation of brain injury metrics for sports head-impact kinematics"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Emily Yik Kwan Chan"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "dynars==1.1.0",
]

[project.optional-dependencies]
damage = ["dynasaur==1.3.53", "numpy<2", "scipy<=1.13.1"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
